# Lista de documentos a descargar. Una entrada por documento.
#
# Obligatorios: doc_id, titulo, fuente, url, areas
# Opcionales:   tipo (senado | html | html_js | pdf; se infiere de la URL si falta),
#               tipo_norma, numero, anio, organo_emisor,
#               seguir_paginas (true por defecto en el Senado),
#               verificar_ssl (false solo si un sitio .gov.co tiene el certificado roto)
#
# Áreas válidas (usen siempre estos nombres):
#   constitucional, administrativo, penal, procesal, comercial, civil,
#   familia, tributario, laboral, mercados
#
# Las URL del Senado siguen el patrón basedoc/<nombre>.html y las páginas
# siguientes (_pr001, _pr002...) se recorren solas. Verifiquen cada URL antes
# de la corrida completa: una URL mal escrita aparece como error en el resumen.

